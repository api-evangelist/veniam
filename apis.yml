name: Veniam
description: Veniam builds intelligent networking software for the Internet of Moving Things, moving
  data automatically, securely, and cost-effectively between connected vehicles, mobile IoT devices,
  and the cloud across all available networks (cellular, Wi-Fi, and DSRC). Its platform serves video
  telematics, connected fleets, industrial IoT, and auto OEM/Tier 1 use cases, and reports processing
  110M+ kilometers of mobile IoT data with 130+ granted patents. Founded by Joao Barros, Susana
  Sargento, Robin Chase, and Roy Russell, the company was acquired by Nexar in 2022. Surfaced as a
  portfolio company of Union Square Ventures. No public developer portal, API documentation, or
  OpenAPI surface was found during enrichment.
